<body class="bg-background text-on-surface antialiased">

    <!-- טעינת קובץ התוכן והרנדור -->
    <script src="content.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof siteData === 'undefined') {
                console.error('siteData is not loaded. Please make sure content.js is in the same directory.');
                return;
            }

            // 1. Render Header
const brandEl = document.getElementById('nav-brand');
brandEl.innerHTML = `
    <img src="${siteData.brand.logo}" alt="${siteData.brand.nameEn} Logo" width="48" height="48" class="h-9 md:h-12 w-auto object-contain" />
    <span class="text-lg md:text-xl font-semibold tracking-tight text-on-background font-headline">${siteData.brand.nameEn}</span>
`;

            const navLinksEl = document.getElementById('nav-links');
            navLinksEl.innerHTML = siteData.nav.map((link, idx) => `
                <a class="nav-link ${idx === 0 ? 'text-primary font-semibold border-primary' : 'text-on-surface-variant font-medium border-transparent'} border-b-2 hover:text-primary pb-1 transition-colors duration-300" href="${link.href}">${link.label}</a>
            `).join('');

            // 2. Render Hero
            const heroEl = document.getElementById('hero-container');
            heroEl.innerHTML = `
                <span class="text-primary-dim font-bold tracking-[0.2em] text-sm uppercase mb-6 block">${siteData.hero.badge}</span>
                <h1 class="text-[2.2rem] md:text-[3.2rem] font-medium text-on-background tracking-tight leading-[1.2] mb-8">${siteData.hero.title}</h1>
                <div class="text-[1rem] md:text-[1.1rem] text-on-surface-variant leading-[1.8] mb-12 font-medium max-w-[800px] mx-auto">
                    <blockquote class="mb-6 italic text-primary text-lg">
                        ${siteData.hero.quoteText} <br/>
                        <cite class="text-sm font-normal not-italic block mt-1">${siteData.hero.quoteAuthor}</cite>
                    </blockquote>
                    <p>${siteData.hero.intro}</p>
                </div>
                <div class="flex flex-col sm:flex-row justify-center gap-4 sm:gap-5 w-full max-w-lg mx-auto">
                    ${siteData.hero.buttons.map(btn => `
                        <a href="${btn.href}" class="w-full sm:flex-1 flex items-center justify-center ${btn.style === 'primary-container' ? 'bg-primary-container text-on-primary-container' : 'bg-primary-mid text-on-primary shadow-ambient'} px-6 py-4 sm:py-3.5 rounded-[0.5rem] font-bold text-[15px] hover:opacity-90 transition-all text-center">
                            ${btn.label}
                        </a>
                    `).join('')}
                </div>
            `;

            // 3. Render About
            document.getElementById('about-title').textContent = siteData.about.title;
            document.getElementById('about-image-container').innerHTML = `
                <img src="${siteData.about.image}" alt="${siteData.about.imageAlt}" width="400" height="500" loading="lazy" decoding="async" class="absolute inset-0 w-full h-full object-cover object-[center_25%] transition-transform duration-700 hover:scale-[1.03]" />
            `;
            document.getElementById('about-text-container').innerHTML = siteData.about.paragraphs.map(p => `<p>${p}</p>`).join('');

            // 4. Render Services
            document.getElementById('services-title').textContent = siteData.servicesSection.title;
            document.getElementById('services-grid').innerHTML = siteData.servicesSection.services.map(s => `
                <article class="bg-surface-container-lowest p-8 md:p-10 rounded-lg shadow-ambient group flex flex-col items-center text-center h-full">
                    <div class="w-[52px] h-[52px] bg-primary-container flex items-center justify-center rounded-full mb-8 text-on-primary-container transition-transform group-hover:scale-105 shrink-0" aria-hidden="true">
                        <span class="material-symbols-outlined text-[26px]">${s.icon}</span>
                    </div>
                    <h3 class="text-[1.25rem] md:text-[1.35rem] font-bold mb-4 text-on-surface">${s.title}</h3>
                    <p class="text-on-surface-variant leading-[1.7] text-[15px] flex-1">${s.desc}</p>
                </article>
            `).join('');

            document.getElementById('tags-title').textContent = siteData.servicesSection.tagsTitle;
            document.getElementById('tags-container').innerHTML = siteData.servicesSection.tags.map(t => `
                <span class="bg-primary-container text-on-primary-container px-4 py-2 rounded-full text-[14px] font-medium">${t}</span>
            `).join('');

            // 5. Render Clinic / Contact
            document.getElementById('clinic-title').textContent = siteData.clinic.title;
            document.getElementById('clinic-grid').innerHTML = siteData.clinic.items.map(item => {
                let bodyContent = '';
                if (item.text) bodyContent += `<p class="text-on-surface-variant text-[15px]">${item.text}</p>`;
                if (item.subText) bodyContent += `<p class="text-on-surface-variant text-[15px] mt-2 font-semibold">${item.subText}</p>`;
                if (item.email) bodyContent += `<p class="text-on-surface-variant text-[15px]"><a href="mailto:${item.email}" class="hover:text-primary transition-colors underline decoration-transparent hover:decoration-primary">${item.email}</a></p>`;
                if (item.phone) bodyContent += `<p class="text-on-surface-variant text-[15px] mt-1" dir="ltr"><a href="tel:${item.phone.replace(/[^0-9]/g, '')}" class="hover:text-primary transition-colors">${item.phone}</a></p>`;

                return `
                    <div class="flex flex-col items-center text-center p-8 md:p-10 bg-surface-container-lowest rounded-lg shadow-ambient group h-full">
                        <div class="w-14 h-14 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-6 transition-transform group-hover:scale-105" aria-hidden="true">
                            <span class="material-symbols-outlined text-[28px]">${item.icon}</span>
                        </div>
                        <h3 class="font-bold text-xl mb-3 text-on-background">${item.title}</h3>
                        ${bodyContent}
                    </div>
                `;
            }).join('');

            // 6. Render Footer
            document.getElementById('footer-text').textContent = siteData.footer.copyright;

            // 7. ScrollSpy Observer
            const sections = document.querySelectorAll('main section');
            const navLinks = document.querySelectorAll('.nav-link');

            const observerOptions = {
                root: null,
                rootMargin: '-20% 0px -60% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const currentId = entry.target.getAttribute('id');
                        navLinks.forEach(link => {
                            const isMatch = link.getAttribute('href') === `#${currentId}`;
                            link.classList.toggle('text-primary', isMatch);
                            link.classList.toggle('font-semibold', isMatch);
                            link.classList.toggle('border-primary', isMatch);
                            link.classList.toggle('text-on-surface-variant', !isMatch);
                            link.classList.toggle('font-medium', !isMatch);
                            link.classList.toggle('border-transparent', !isMatch);
                        });
                    }
                });
            }, observerOptions);

            sections.forEach(section => {
                if (section.getAttribute('id')) {
                    observer.observe(section);
                }
            });
        });
    </script>
